<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12211d">
  <title>Wanderlusst Travel — Organizador de viajes</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312211d'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23e2663f' stroke-width='4'/%3E%3Cpath d='M38 26 28 32l-2 10 10-6 2-10Z' fill='%23f4e7ce'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="mobile-bar" id="mobile-bar">
    <button class="icon-btn mobile-menu" id="mobile-menu" aria-label="Abrir el menú de viajes"></button>
    <div class="mobile-brand"><span class="brand-mark" id="mobile-brand-mark"></span> Wanderlusst Travel</div>
    <div class="mobile-spacer"></div>
  </div>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Tus viajes">
      <div class="sidebar-glow"></div>
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div>
          <div class="brand-name">Wanderlusst Travel</div>
          <div class="brand-tag">viajes, con orden</div>
        </div>
      </div>

      <div class="sidebar-search">
        <span class="search-icon" id="search-icon"></span>
        <input id="trip-search" type="search" placeholder="Busca tus viajes…" autocomplete="off" aria-label="Buscar viajes">
      </div>

      <div class="sidebar-section-head">
        <span>Tus viajes</span>
        <span class="trip-count" id="trip-count">0</span>
      </div>

      <nav class="trip-list" id="trip-list"></nav>

      <div class="sidebar-footer">
        <button class="btn btn-primary btn-block" id="new-trip-btn">
          <span id="new-trip-icon"></span> Viaje nuevo
        </button>
        <p class="sidebar-hint">Todo se queda en este ordenador.</p>
      </div>
    </aside>

    <div class="drawer-overlay" id="drawer-overlay"></div>

    <main class="main" id="main" tabindex="-1">
      <div class="loading-screen">
        <div class="loading-compass"></div>
        <p>Desplegando el mapa…</p>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
